<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width">
<title>NASAR AI - Like Claude</title>
<style>
body{margin:0;font-family:system-ui;background:#212121;color:#fff;display:flex;flex-direction:column;height:100vh}
#header{padding:15px;text-align:center;border-bottom:1px solid #333;font-weight:bold;font-size:20px}
#chat{flex:1;overflow-y:auto;padding:20px}
.msg{margin:15px 0;max-width:80%;padding:12px 15px;border-radius:18px;line-height:1.5}
.user{background:#2f2f2f;align-self:flex-end;margin-left:auto}
.ai{background:#444654}
#inputBar{display:flex;padding:15px;background:#2f2f2f;gap:10px}
#inputBar input{flex:1;padding:12px;border-radius:25px;border:none;outline:none;background:#40414f;color:#fff}
#inputBar button{padding:12px 22px;border-radius:25px;border:none;background:#19c37d;color:#fff;font-weight:bold}
</style>
</head>
<body>
<div id="header">🤖 NASAR AI • Claude Jaisa Assistant</div>
<div id="chat"></div>
<div id="inputBar">
<input id="q" placeholder="Nasar se kuch bolo... jaise 'mera homework kar de'">
<button onclick="send()">Send</button>
</div>
<script>
const chat = document.getElementById('chat');
function addMsg(text, who){
  let d=document.createElement('div');
  d.className='msg '+who; d.innerText=text;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
async function send(){
  let input=document.getElementById('q'); let question=input.value;
  if(!question) return;
  addMsg(question,'user'); input.value='';
  addMsg("Soch raha hu...",'ai');
  // Yaha AI API lagega
  setTimeout(()=>{
    chat.lastChild.innerText = "Nasar, ye kaam ho gaya! ✅\n\nTune bola: '"+question+"'\n\nMain abhi demo mode me hu. Jaise hi tu API key lagayega, main sach me code likhunga, file banaunga, Google search karunga - bilkul Claude ki tarah!";
  },1000);
}
addMsg("Hi Nasar! Main tera personal Claude hu. Bol kya karwana hai?","ai");
</script>
</body>
</html>
