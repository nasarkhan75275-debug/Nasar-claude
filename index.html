<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NASAR AI</title>
<style>
body{margin:0;font-family:system-ui;background:#111;color:#fff;display:flex;flex-direction:column;height:100vh}
#top{padding:14px;text-align:center;border-bottom:1px solid #333;font-weight:800}
#chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:85%;padding:12px 14px;border-radius:14px;white-space:pre-wrap}
.me{background:#2f2f2f;align-self:flex-end}
.bot{background:#444654;align-self:flex-start}
#bar{display:flex;padding:10px;gap:8px;background:#222}
#bar input{flex:1;padding:12px;border-radius:20px;border:none;background:#333;color:#fff}
#bar button{padding:12px 18px;border-radius:20px;border:none;background:#19c37d;color:#fff;font-weight:700}
</style>
</head>
<body>
<div id="top">🔥 NASAR AI - Ready</div>
<div id="chat"></div>
<div id="bar">
<input id="msg" placeholder="Kuch bhi puch Nasar...">
<button onclick="go()">Send</button>
</div>
<script>
// === YAHAN KEY DALO - 5 SEC KA KAAM ===
const GROQ_API_KEY = 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
// ======================================
const chat=document.getElementById('chat');
const input=document.getElementById('msg');
function add(t,c){let d=document.createElement('div');d.className='bubble '+c;d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
async function go(){
 let q=input.value.trim(); if(!q) return;
 add(q,'me'); input.value='';
 let a=add('Typing...','bot');
 try{
  let r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_API_KEY},body:JSON.stringify({model:"llama-3.1-8b-instant",messages:[{role:"system",content:"You are NASAR AI, personal assistant of Nasar Khan. Be smart like Claude, friendly, Hindi+English mix."},{role:"user",content:q}]})});
  let j=await r.json(); if(j.error) throw j.error.message;
  a.innerText=j.choices[0].message.content;
 }catch(e){ a.innerText="Error: Key check karo. "+e; }
}
input.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
add("Hi Nasar! 🚀 Code ready hai, bas upar key daal ke Commit kar de!","bot");
</script>
</body>
</html>
